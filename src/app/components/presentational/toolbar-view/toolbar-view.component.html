<header class="toolbar">
  <h1>{{ title() }}</h1>

  <button
    type="button"
    class="cart-button"
    aria-label="Open shopping cart"
    (click)="onCartClick()"
  >
    <span class="cart-icon" aria-hidden="true">&#128722;</span>

    @if (cartItemCount() > 0) {
      <span class="cart-badge">{{ cartItemCount() }}</span>
    }
  </button>
</header>
