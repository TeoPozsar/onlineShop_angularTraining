@if (product(); as selectedProduct) {
  <app-products-details-view [product]="selectedProduct"/>

  <button type="button" (click)="onAddToCart(selectedProduct)">
    Add to Cart
  </button>

  <button
    type="button"
    (click)="onDeleteProduct(selectedProduct.id)"
  >
    Delete Product
  </button>

} @else {
  <p>Loading product...</p>
}
