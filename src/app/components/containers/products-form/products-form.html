@if (operationError()) {
  <p class="error-message">{{ operationError() }}</p>
}

@if (loadErrorMessage()) {
  <p class="error-message">{{ loadErrorMessage() }}</p>
}

<app-products-form-view
  [productForm]="productForm"
  [title]="isEditing ? 'Edit Product' : 'Add Product'"
  [isSaving]="operationLoading()"
  [isLoading]="isEditing && productLoading()"
  [saveDisabled]="saveDisabled()"
  (save)="onSave()"
  (cancel)="onCancel()"
/>
